annotations = "26.0.1"
geantyref = "1.3.16"
slf4j = "2.0.17"
java-websocket = "1.6.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref="jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref="jackson-major" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref="jackson" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
geantyref = { module = "io.leangen.geantyref:geantyref", version.ref = "geantyref" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "java-websocket" }
